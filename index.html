<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📁 gitpo - File Manager</title>
    <style>
        /* ============================================
           RESET & VARIABLES
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-body: #f0f2f5;
            --bg-sidebar: #1a202c;
            --bg-card: #ffffff;
            --text-dark: #1a202c;
            --text-gray: #4a5568;
            --text-light: #a0aec0;
            --border-color: #e2e8f0;
            --primary: #667eea;
            --primary-hover: #5a67d8;
            --success: #48bb78;
            --danger: #fc8181;
            --warning: #ecc94b;
            --radius: 8px;
            --shadow: 0 2px 10px rgba(0,0,0,0.05);
            --transition: all 0.3s ease;
        }
        body.dark-mode {
            --bg-body: #1a202c;
            --bg-card: #2d3748;
            --text-dark: #e2e8f0;
            --text-gray: #a0aec0;
            --text-light: #718096;
            --border-color: #4a5568;
        }
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-body);
            color: var(--text-dark);
            transition: var(--transition);
            min-height: 100vh;
        }

        /* ============================================
           LAYOUT
           ============================================ */
        .app {
            display: flex;
            min-height: 100vh;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 240px;
            background: var(--bg-sidebar);
            color: white;
            padding: 20px 16px;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar .logo {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar .logo span {
            background: var(--primary);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.6rem;
        }
        .sidebar .menu-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1px;
            margin: 20px 0 8px 0;
        }
        .sidebar .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .sidebar .menu-item:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        .sidebar .menu-item.active {
            background: var(--primary);
            color: white;
        }
        .sidebar .menu-item .icon {
            font-size: 1.2rem;
        }
        .sidebar .menu-item .badge {
            margin-left: auto;
            background: var(--danger);
            color: white;
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 50px;
        }

        /* ===== MAIN CONTENT ===== */
        .main {
            flex: 1;
            padding: 20px 30px;
            min-width: 0;
        }

        /* ===== HEADER MAIN ===== */
        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }
        .main-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }
        .main-header .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }
        .btn-success {
            background: var(--success);
            color: white;
        }
        .btn-success:hover {
            opacity: 0.8;
        }
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        .btn-danger:hover {
            opacity: 0.8;
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 0.75rem;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-gray);
        }
        .btn-outline:hover {
            background: var(--bg-body);
        }

        /* ===== TOOLBAR ===== */
        .toolbar {
            background: var(--bg-card);
            padding: 12px 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }
        .toolbar .info {
            font-size: 0.85rem;
            color: var(--text-gray);
        }
        .toolbar .info span {
            font-weight: 700;
            color: var(--primary);
        }
        .toolbar .search input {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            background: var(--bg-body);
            color: var(--text-dark);
            font-size: 0.85rem;
            width: 200px;
        }
        .toolbar .search input:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* ===== UPLOAD BOX ===== */
        .upload-box {
            background: var(--bg-card);
            border: 2px dashed var(--border-color);
            border-radius: var(--radius);
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
            transition: var(--transition);
            cursor: pointer;
        }
        .upload-box:hover {
            border-color: var(--primary);
            background: var(--bg-body);
        }
        .upload-box .icon {
            font-size: 2.5rem;
        }
        .upload-box input[type="file"] {
            display: none;
        }
        .upload-box label {
            cursor: pointer;
            color: var(--primary);
            font-weight: 600;
        }
        .upload-box .hint {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 5px;
        }

        /* ===== TABLE / FILE LIST ===== */
        .file-table-wrap {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .file-table {
            width: 100%;
            border-collapse: collapse;
        }
        .file-table th {
            text-align: left;
            padding: 12px 16px;
            background: var(--bg-body);
            color: var(--text-gray);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
        }
        .file-table td {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
            vertical-align: middle;
        }
        .file-table tr:hover {
            background: var(--bg-body);
        }
        .file-table .file-icon {
            font-size: 1.5rem;
            margin-right: 10px;
        }
        .file-table .file-name {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        .file-table .file-name .ext {
            font-size: 0.6rem;
            background: var(--bg-body);
            padding: 2px 8px;
            border-radius: 4px;
            color: var(--text-light);
        }
        .file-table .file-size {
            color: var(--text-light);
            font-size: 0.8rem;
        }
        .file-table .file-date {
            color: var(--text-light);
            font-size: 0.8rem;
        }
        .file-table .file-actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .file-table .file-actions .btn-sm {
            padding: 3px 10px;
            font-size: 0.7rem;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }
        .btn-sm.download {
            background: var(--primary);
            color: white;
        }
        .btn-sm.download:hover {
            background: var(--primary-hover);
        }
        .btn-sm.delete {
            background: var(--danger);
            color: white;
        }
        .btn-sm.delete:hover {
            opacity: 0.8;
        }
        .btn-sm.view {
            background: var(--success);
            color: white;
        }
        .btn-sm.view:hover {
            opacity: 0.8;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }
        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        /* ===== LIGHTBOX ===== */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .lightbox.active {
            display: flex;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
        }
        .lightbox .close-lightbox {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 2.5rem;
            cursor: pointer;
            background: none;
            border: none;
            transition: var(--transition);
        }
        .lightbox .close-lightbox:hover {
            transform: scale(1.2);
            color: var(--danger);
        }
        .lightbox .lightbox-info {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
            background: rgba(0,0,0,0.5);
            padding: 8px 20px;
            border-radius: 50px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .app {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                padding: 12px 16px;
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
            }
            .sidebar .logo {
                margin-bottom: 0;
                width: 100%;
            }
            .sidebar .menu-label {
                display: none;
            }
            .sidebar .menu-item {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
            .main {
                padding: 15px;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .toolbar .search input {
                width: 100%;
            }
            .file-table {
                font-size: 0.8rem;
            }
            .file-table th,
            .file-table td {
                padding: 8px 10px;
            }
            .file-table .file-actions {
                flex-direction: column;
                gap: 3px;
            }
        }
        @media (max-width: 600px) {
            .main-header {
                flex-direction: column;
                align-items: stretch;
            }
            .main-header .actions {
                justify-content: stretch;
            }
            .main-header .actions .btn {
                flex: 1;
                justify-content: center;
            }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-body);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar">
            <div class="logo">
                📁 gitpo
                <span>v3</span>
            </div>
            <div class="menu-label">Menu</div>
            <a class="menu-item active" onclick="switchTab('all')">
                <span class="icon">📂</span> Semua File
                <span class="badge" id="totalBadge">0</span>
            </a>
            <a class="menu-item" onclick="switchTab('image')">
                <span class="icon">🖼️</span> Foto
            </a>
            <a class="menu-item" onclick="switchTab('document')">
                <span class="icon">📄</span> Dokumen
            </a>
            <a class="menu-item" onclick="switchTab('archive')">
                <span class="icon">📦</span> Arsip
            </a>
            <a class="menu-item" onclick="toggleTheme()">
                <span class="icon">🌙</span> <span id="themeLabel">Dark Mode</span>
            </a>
        </aside>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="main">
            <!-- HEADER -->
            <div class="main-header">
                <h1 id="pageTitle">📂 Semua File</h1>
                <div class="actions">
                    <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">📤 Upload File</button>
                    <button class="btn btn-outline" onclick="clearAll()">🗑️ Kosongkan</button>
                </div>
                <input type="file" id="fileInput" multiple style="display:none" onchange="handleFiles(this.files)">
            </div>

            <!-- TOOLBAR -->
            <div class="toolbar">
                <div class="info">
                    📁 <span id="fileCount">0</span> file • 
                    💾 <span id="totalSize">0 KB</span>
                </div>
                <div class="search">
                    <input type="text" id="searchInput" placeholder="🔍 Cari file..." oninput="filterFiles()">
                </div>
            </div>

            <!-- UPLOAD BOX (Drag & Drop) -->
            <div class="upload-box" id="uploadBox" ondrop="handleDrop(event)" ondragover="event.preventDefault()">
                <div class="icon">📤</div>
                <p>
                    <label for="fileInput">Klik untuk upload</label>
                    atau drag & drop file di sini
                </p>
                <div class="hint">Support semua jenis file | Maks 10MB</div>
            </div>

            <!-- FILE TABLE -->
            <div class="file-table-wrap">
                <table class="file-table">
                    <thead>
                        <tr>
                            <th style="width:45%">Nama File</th>
                            <th style="width:15%">Ukuran</th>
                            <th style="width:20%">Tanggal</th>
                            <th style="width:20%">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="fileTableBody">
                        <tr>
                            <td colspan="4">
                                <div class="empty-state">
                                    <div class="icon">📁</div>
                                    <p>Belum ada file. Upload file pertama!</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- ===== LIGHTBOX ===== -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <button class="close-lightbox" onclick="closeLightbox()">✕</button>
        <img id="lightboxImage" src="" alt="Preview">
        <div class="lightbox-info" id="lightboxInfo">Foto</div>
    </div>

    <script>
        // ============================================
        //  STATE
        // ============================================
        let files = JSON.parse(localStorage.getItem('gitpo_files_v3')) || [];
        let currentTab = 'all';
        let searchQuery = '';

        // ============================================
        //  DOM REFS
        // ============================================
        const tbody = document.getElementById('fileTableBody');
        const fileCount = document.getElementById('fileCount');
        const totalSize = document.getElementById('totalSize');
        const totalBadge = document.getElementById('totalBadge');
        const pageTitle = document.getElementById('pageTitle');
        const fileInput = document.getElementById('fileInput');

        // ============================================
        //  FORMAT HELPERS
        // ============================================
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function formatDate(ts) {
            const d = new Date(ts);
            return d.toLocaleDateString('id-ID') + ' ' + d.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
        }

        function getFileIcon(name) {
            const ext = name.split('.').pop().toLowerCase();
            const icons = {
                // Images
                jpg: '🖼️', jpeg: '🖼️', png: '🖼️', gif: '🖼️', webp: '🖼️', svg: '🖼️',
                // Documents
                pdf: '📄', doc: '📝', docx: '📝', txt: '📃', rtf: '📃',
                // Spreadsheets
                xls: '📊', xlsx: '📊', csv: '📊',
                // Presentations
                ppt: '📽️', pptx: '📽️',
                // Archives
                zip: '📦', rar: '📦', 7z: '📦', tar: '📦', gz: '📦',
                // Audio/Video
                mp3: '🎵', wav: '🎵', mp4: '🎬', avi: '🎬', mkv: '🎬',
                // Code
                html: '🌐', css: '🎨', js: '⚡', php: '🐘', py: '🐍', json: '📋',
                // Others
                exe: '⚙️', dmg: '💿', iso: '💿'
            };
            return icons[ext] || '📎';
        }

        function getFileType(name) {
            const ext = name.split('.').pop().toLowerCase();
            const imageExts = ['jpg','jpeg','png','gif','webp','svg','bmp','ico'];
            const docExts = ['pdf','doc','docx','txt','rtf','odt'];
            const archiveExts = ['zip','rar','7z','tar','gz','bz2'];
            if (imageExts.includes(ext)) return 'image';
            if (docExts.includes(ext)) return 'document';
            if (archiveExts.includes(ext)) return 'archive';
            return 'other';
        }

        // ============================================
        //  RENDER
        // ============================================
        function render() {
            let filtered = [...files];

            // Filter by tab
            if (currentTab === 'image') filtered = filtered.filter(f => getFileType(f.name) === 'image');
            else if (currentTab === 'document') filtered = filtered.filter(f => getFileType(f.name) === 'document');
            else if (currentTab === 'archive') filtered = filtered.filter(f => getFileType(f.name) === 'archive');

            // Search
            if (searchQuery.trim()) {
                const q = searchQuery.toLowerCase().trim();
                filtered = filtered.filter(f => f.name.toLowerCase().includes(q));
            }

            // Sort: newest first
            filtered.sort((a, b) => b.date - a.date);

            // Update badge
            totalBadge.textContent = files.length;

            // Update counts
            fileCount.textContent = filtered.length;
            const totalBytes = files.reduce((sum, f) => sum + f.size, 0);
            totalSize.textContent = formatSize(totalBytes);

            // Update title
            const tabNames = {
                all: '📂 Semua File',
                image: '🖼️ Foto',
                document: '📄 Dokumen',
                archive: '📦 Arsip'
            };
            pageTitle.textContent = tabNames[currentTab] || '📂 Semua File';

            // Render table
            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4">
                            <div class="empty-state">
                                <div class="icon">📁</div>
                                <p>${files.length === 0 ? 'Belum ada file. Upload file pertama!' : 'Tidak ada file yang cocok.'}</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = filtered.map((file, index) => {
                const isImage = getFileType(file.name) === 'image';
                return `
                    <tr>
                        <td>
                            <div class="file-name">
                                <span class="file-icon">${getFileIcon(file.name)}</span>
                                ${file.name}
                                <span class="ext">${file.name.split('.').pop().toUpperCase()}</span>
                            </div>
                        </td>
                        <td class="file-size">${formatSize(file.size)}</td>
                        <td class="file-date">${formatDate(file.date)}</td>
                        <td>
                            <div class="file-actions">
                                ${isImage ? `<button class="btn-sm view" onclick="viewFile('${file.id}')">👁️ Lihat</button>` : ''}
                                <button class="btn-sm download" onclick="downloadFile('${file.id}')">⬇️</button>
                                <button class="btn-sm delete" onclick="deleteFile('${file.id}')">🗑️</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // ============================================
        //  FILE OPERATIONS
        // ============================================
        function addFiles(fileList) {
            const maxSize = 10 * 1024 * 1024;
            let added = 0;
            for (const file of fileList) {
                if (file.size > maxSize) {
                    alert(`⚠️ ${file.name} terlalu besar. Maks 10MB.`);
                    continue;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    files.push({
                        id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                        name: file.name,
                        data: e.target.result,
                        size: file.size,
                        type: file.type,
                        date: Date.now()
                    });
                    added++;
                    if (added === fileList.length || added === 1) {
                        localStorage.setItem('gitpo_files_v3', JSON.stringify(files));
                        render();
                        if (added === fileList.length) {
                            alert(`✅ ${added} file berhasil diupload!`);
                        }
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function handleFiles(fileList) {
            if (fileList.length === 0) return;
            addFiles(fileList);
            fileInput.value = '';
        }

        function handleDrop(e) {
            e.preventDefault();
            if (e.dataTransfer.files.length > 0) {
                addFiles(e.dataTransfer.files);
            }
        }

        function deleteFile(id) {
            if (!confirm('Yakin ingin menghapus file ini?')) return;
            files = files.filter(f => f.id !== id);
            localStorage.setItem('gitpo_files_v3', JSON.stringify(files));
            render();
        }

        function downloadFile(id) {
            const file = files.find(f => f.id === id);
            if (!file) return;
            const a = document.createElement('a');
            a.href = file.data;
            a.download = file.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function viewFile(id) {
            const file = files.find(f => f.id === id);
            if (!file) return;
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightboxImage');
            const info = document.getElementById('lightboxInfo');
            img.src = file.data;
            info.textContent = file.name + ' • ' + formatSize(file.size);
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        function clearAll() {
            if (files.length === 0) return;
            if (!confirm('Yakin ingin menghapus SEMUA file?')) return;
            files = [];
            localStorage.setItem('gitpo_files_v3', JSON.stringify(files));
            render();
        }

        // ============================================
        //  FILTER & SEARCH
        // ============================================
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.sidebar .menu-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sidebar .menu-item').forEach(el => {
                if (el.textContent.trim().toLowerCase().includes(
                    tab === 'all' ? 'semua' :
                    tab === 'image' ? 'foto' :
                    tab === 'document' ? 'dokumen' : 'arsip'
                )) {
                    el.classList.add('active');
                }
            });
            render();
        }

        function filterFiles() {
            searchQuery = document.getElementById('searchInput').value;
            render();
        }

        // ============================================
        //  THEME
        // ============================================
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const label = document.getElementById('themeLabel');
            label.textContent = document.body.classList.contains('dark-mode') ? 'Light Mode' : 'Dark Mode';
            document.querySelector('.sidebar .menu-item:last-child .icon').textContent =
                document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
        }

        // ============================================
        //  KEYBOARD SHORTCUTS
        // ============================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'o' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                document.getElementById('fileInput').click();
            }
        });

        // ============================================
        //  INIT
        // ============================================
        render();
    </script>
</body>
</html>
